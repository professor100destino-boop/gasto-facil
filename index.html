<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#0f172a"><meta name="description" content="GASTO FÁCIL - controle pessoal de gastos">
<link rel="manifest" href="./manifest.webmanifest"><title>GASTO FÁCIL</title>
<style>
:root{font-family:Arial,sans-serif;color:#0f172a;background:#f1f5f9}*{box-sizing:border-box}body{margin:0}.top{position:sticky;top:0;background:#0f172a;color:#fff;padding:14px;display:flex;justify-content:space-between;align-items:center}.brand{display:flex;gap:10px;align-items:center}.logo{background:#22c55e;color:#052e16;font-weight:900;padding:12px;border-radius:14px}.wrap{max-width:1050px;margin:auto;padding:16px}.grid{display:grid;gap:12px}.stats{grid-template-columns:repeat(auto-fit,minmax(170px,1fr))}.card{background:#fff;border:1px solid #e2e8f0;border-radius:16px;padding:16px;box-shadow:0 5px 18px #0f172a12}.value{font-size:25px;font-weight:800;margin-top:5px}.small{font-size:12px;color:#64748b}.nav{display:flex;gap:7px;overflow:auto;margin:16px 0}.nav button,.btn{border:0;border-radius:11px;padding:10px 13px;font-weight:700;cursor:pointer}.nav button{white-space:nowrap;background:#e2e8f0}.nav button.on,.dark{background:#0f172a;color:white}.green{background:#22c55e;color:#052e16}.red{background:#fee2e2;color:#991b1b}.section{display:none}.section.on{display:block}.head{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px}.upload{display:block;text-align:center;border:2px dashed #94a3b8;padding:28px;border-radius:16px;background:#fff}.upload input{display:none}.form{display:grid;grid-template-columns:1fr 1fr;gap:10px}.field{display:flex;flex-direction:column;gap:5px}.field.full{grid-column:1/-1}input,select{padding:10px;border:1px solid #cbd5e1;border-radius:10px;background:#fff}.table{overflow:auto;background:#fff;border-radius:14px;border:1px solid #e2e8f0}table{width:100%;border-collapse:collapse;min-width:720px}th,td{padding:11px;border-bottom:1px solid #e2e8f0;text-align:left;font-size:14px}.modalbg{position:fixed;inset:0;background:#0008;display:grid;place-items:center;padding:15px}.modal{width:min(650px,100%);max-height:92vh;overflow:auto;background:#fff;border-radius:16px;padding:18px}.actions{display:flex;justify-content:flex-end;gap:8px;margin-top:15px}.notice{padding:10px;background:#eff6ff;color:#1e3a8a;border-radius:10px;margin:8px 0}.future{display:flex;justify-content:space-between;padding:10px;background:#f8fafc;border-radius:10px;margin:6px 0}@media(max-width:650px){.form{grid-template-columns:1fr}.head{align-items:flex-start;flex-direction:column;gap:8px}.head .btn{width:100%}.wrap{padding:11px}}
</style>
</head>
<body><header class="top"><div class="brand"><div class="logo">GF</div><div><b>GASTO FÁCIL</b><div class="small" style="color:#cbd5e1">Compartilhou, categorizou, terminou.</div></div></div><button id="install" class="btn green" hidden>Instalar</button></header>
<main class="wrap"><div id="stats" class="grid stats"></div><nav class="nav"><button class="on" data-tab="inicio">Início</button><button data-tab="comprovantes">Comprovantes</button><button data-tab="lancamentos">Lançamentos</button><button data-tab="cartoes">Cartões</button><button data-tab="futuro">Débitos futuros</button></nav>
<section id="inicio" class="section on"><div class="head"><h2>Resumo do mês</h2></div><div id="resumo" class="card"></div></section>
<section id="comprovantes" class="section"><div class="head"><h2>Enviar comprovante</h2></div><label class="upload"><input id="arquivo" type="file" accept="image/*,application/pdf"><b>Toque para escolher o comprovante</b><p class="small">PIX, boleto, transferência, débito ou crédito.</p><div id="status"></div></label></section>
<section id="lancamentos" class="section"><div class="head"><h2>Lançamentos</h2><button id="novo" class="btn dark">Novo lançamento</button></div><div id="lista"></div></section>
<section id="cartoes" class="section"><div class="head"><h2>Cartões cadastrados</h2><button id="novoCartao" class="btn dark">Cadastrar cartão</button></div><div id="cards" class="grid stats"></div></section>
<section id="futuro" class="section"><div class="head"><h2>Débitos futuros</h2></div><div id="futuros"></div></section></main><div id="modal"></div>
<script src="https://cdn.jsdelivr.net/npm/tesseract.js@5/dist/tesseract.min.js"></script>
<script>
const P='gf:',cats=['Alimentação','Mercado','Combustível','Moradia','Água','Energia','Internet','Telefone','Saúde','Educação','Transporte','Lazer','Moto','Assinaturas','Impostos','Empréstimos','Outros'];let promptInstall=null;
const get=k=>JSON.parse(localStorage.getItem(P+k)||'[]'),set=(k,v)=>localStorage.setItem(P+k,JSON.stringify(v)),id=()=>crypto.randomUUID(),hoje=()=>new Date().toISOString().slice(0,10),money=v=>Number(v||0).toLocaleString('pt-BR',{style:'currency',currency:'BRL'}),esc=s=>String(s||'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])),fmt=d=>d?d.split('-').reverse().join('/'):'-';
function modal(h){document.querySelector('#modal').innerHTML='<div class="modalbg"><div class="modal">'+h+'</div></div>'}function fechar(){document.querySelector('#modal').innerHTML=''}
function render(){let t=get('t'),c=get('c'),ym=hoje().slice(0,7),mes=t.filter(x=>(x.date||'').startsWith(ym)),g=mes.filter(x=>x.kind==='expense'&&x.status!=='future').reduce((s,x)=>s+x.amount,0),r=mes.filter(x=>x.kind==='income').reduce((s,x)=>s+x.amount,0),f=t.filter(x=>x.status==='future').reduce((s,x)=>s+x.amount,0);stats.innerHTML=[['Gastos no mês',g],['Receitas no mês',r],['Débitos futuros',f],['Saldo do mês',r-g]].map(x=>'<div class="card"><div class="small">'+x[0]+'</div><div class="value">'+money(x[1])+'</div></div>').join('');let bc={};mes.filter(x=>x.kind==='expense').forEach(x=>bc[x.category]=(bc[x.category]||0)+x.amount);let top=Object.entries(bc).sort((a,b)=>b[1]-a[1]).slice(0,5);resumo.innerHTML=top.length?'<h3>Maiores categorias</h3>'+top.map(x=>'<div class="future"><span>'+esc(x[0])+'</span><b>'+money(x[1])+'</b></div>').join(''):'Nenhum gasto lançado neste mês.';lista.innerHTML=t.length?'<div class="table"><table><thead><tr><th>Data</th><th>Descrição</th><th>Categoria</th><th>Pagamento</th><th>Valor</th><th></th></tr></thead><tbody>'+[...t].sort((a,b)=>(b.date||'').localeCompare(a.date||'')).map(x=>'<tr><td>'+fmt(x.date)+'</td><td>'+esc(x.merchant)+'</td><td>'+esc(x.category)+'</td><td>'+label(x.payment)+'</td><td><b>'+money(x.amount)+'</b></td><td><button class="btn red" onclick="apagar(\''+x.id+'\')">Excluir</button></td></tr>').join('')+'</tbody></table></div>':'<div class="card">Nenhum lançamento.</div>';cards.innerHTML=c.length?c.map(x=>{let used=t.filter(y=>y.card===x.id&&y.status==='future').reduce((s,y)=>s+y.amount,0);return '<div class="card"><h3>'+esc(x.name)+' • '+esc(x.last4)+'</h3><div>Limite: <b>'+money(x.limit)+'</b></div><div>Comprometido: <b>'+money(used)+'</b></div><div>Disponível: <b>'+money(x.limit-used)+'</b></div><div class="small">Fecha dia '+x.close+' • vence dia '+x.due+'</div><button class="btn red" onclick="apagarCartao(\''+x.id+'\')">Excluir</button></div>'}).join(''):'<div class="card">Nenhum cartão cadastrado.</div>';let fu=t.filter(x=>x.status==='future').sort((a,b)=>(a.invoice||'').localeCompare(b.invoice||''));futuros.innerHTML=fu.length?'<div class="table"><table><thead><tr><th>Fatura</th><th>Cartão</th><th>Descrição</th><th>Parcela</th><th>Valor</th></tr></thead><tbody>'+fu.map(x=>'<tr><td>'+esc(x.invoice)+'</td><td>'+esc((c.find(y=>y.id===x.card)||{}).name||'-')+'</td><td>'+esc(x.merchant)+'</td><td>'+esc(x.part||'1/1')+'</td><td><b>'+money(x.amount)+'</b></td></tr>').join('')+'</tbody></table></div>':'<div class="card">Nenhum débito futuro.</div>'}
function label(x){return({pix:'PIX',boleto:'Boleto',transfer:'Transferência',debit:'Débito',credit:'Crédito',cash:'Dinheiro'}[x]||x)}function apagar(i){set('t',get('t').filter(x=>x.id!==i&&x.group!==i));render()}function apagarCartao(i){set('c',get('c').filter(x=>x.id!==i));render()}
function form(d={}){let cs=get('c');return '<div class="form"><div class="field"><label>Tipo</label><select id="kind"><option value="expense">Despesa</option><option value="income">Receita</option></select></div><div class="field"><label>Data</label><input id="date" type="date" value="'+(d.date||hoje())+'"></div><div class="field full"><label>Descrição/estabelecimento</label><input id="merchant" value="'+esc(d.merchant||'')+'"></div><div class="field"><label>Valor</label><input id="amount" type="number" step="0.01" value="'+(d.amount||'')+'"></div><div class="field"><label>Categoria</label><select id="category">'+cats.map(x=>'<option>'+x+'</option>').join('')+'</select></div><div class="field"><label>Pagamento</label><select id="payment">'+[['pix','PIX'],['boleto','Boleto'],['transfer','Transferência'],['debit','Cartão de débito'],['credit','Cartão de crédito'],['cash','Dinheiro']].map(x=>'<option value="'+x[0]+'">'+x[1]+'</option>').join('')+'</select></div><div class="field"><label>Parcelas</label><input id="parts" type="number" min="1" max="60" value="'+(d.parts||1)+'"></div><div class="field full" id="cardField"><label>Cartão</label><select id="card"><option value="">Selecione</option>'+cs.map(x=>'<option value="'+x.id+'">'+esc(x.name)+' • '+x.last4+'</option>').join('')+'</select></div></div>'}
function novoLanc(d={}){modal('<h3>Salvar lançamento</h3><div class="notice">Confira os dados e escolha a categoria.</div>'+form(d)+'<div class="actions"><button class="btn" onclick="fechar()">Cancelar</button><button class="btn green" id="salvar">Salvar</button></div>');payment.value=d.payment||'pix';cardField.style.display=payment.value==='credit'?'flex':'none';payment.onchange=()=>cardField.style.display=payment.value==='credit'?'flex':'none';salvar.onclick=()=>salvarTx()}
function addMes(date,n){let d=new Date(date+'T12:00:00');d.setMonth(d.getMonth()+n);return d}function fatura(card,date,n){let d=addMes(date,n),day=new Date(date+'T12:00:00').getDate();if(day>Number(card.close))d=addMes(date,n+1);return String(d.getMonth()+1).padStart(2,'0')+'/'+d.getFullYear()}
function salvarTx(){let amount=Number(document.querySelector('#amount').value),payment=document.querySelector('#payment').value,parts=Math.max(1,Number(document.querySelector('#parts').value||1)),card=document.querySelector('#card').value;if(!amount||!merchant.value.trim())return alert('Informe descrição e valor.');if(payment==='credit'&&!card)return alert('Selecione o cartão.');let t=get('t'),base={kind:kind.value,date:date.value,merchant:merchant.value.trim(),category:category.value,payment,amount};if(payment==='credit'){let c=get('c').find(x=>x.id===card),group=id(),each=Math.floor(amount*100/parts)/100,rest=Math.round((amount-each*parts)*100)/100;for(let i=0;i<parts;i++)t.push({...base,id:id(),group,card,status:'future',amount:each+(i===parts-1?rest:0),part:(i+1)+'/'+parts,invoice:fatura(c,date.value,i)})}else t.push({...base,id:id(),status:'paid'});set('t',t);fechar();render()}
novo.onclick=()=>novoLanc();novoCartao.onclick=()=>{modal('<h3>Cadastrar cartão</h3><div class="form"><div class="field full"><label>Nome</label><input id="cname" placeholder="Ex.: Nubank"></div><div class="field"><label>Final do cartão</label><input id="clast" maxlength="4"></div><div class="field"><label>Limite</label><input id="climit" type="number" step="0.01"></div><div class="field"><label>Fechamento</label><input id="cclose" type="number" min="1" max="31"></div><div class="field"><label>Vencimento</label><input id="cdue" type="number" min="1" max="31"></div></div><div class="actions"><button class="btn" onclick="fechar()">Cancelar</button><button class="btn green" id="saveCard">Salvar</button></div>');saveCard.onclick=()=>{if(!cname.value||clast.value.length!==4)return alert('Informe nome e os 4 últimos números.');let c=get('c');c.push({id:id(),name:cname.value,last4:clast.value,limit:Number(climit.value||0),close:Number(cclose.value||1),due:Number(cdue.value||1)});set('c',c);fechar();render()}}
function parseText(text){let clean=text.replace(/\s+/g,' '),vals=[...clean.matchAll(/(?:R\$\s*)?([0-9]{1,3}(?:\.[0-9]{3})*,[0-9]{2})/g)].map(m=>Number(m[1].replace(/\./g,'').replace(',','.'))),amount=vals.length?Math.max(...vals):0,m=clean.match(/\b(\d{2})[\/.\-](\d{2})[\/.\-](\d{4})\b/),date=m?m[3]+'-'+m[2]+'-'+m[1]:hoje(),low=clean.toLowerCase(),payment=/cr[eé]dito/.test(low)?'credit':/d[eé]bito/.test(low)?'debit':/boleto|c[oó]digo de barras/.test(low)?'boleto':/transfer[eê]ncia|ted|doc/.test(low)?'transfer':'pix',pm=clean.match(/(\d{1,2})\s*x/i),parts=pm?Number(pm[1]):1,lines=text.split(/\n/).map(x=>x.trim()).filter(x=>x.length>3&&x.length<70),merchant=lines.find(x=>!/(comprovante|pagamento|pix|transfer|data|valor|banco|cpf|cnpj)/i.test(x))||'';return{amount,date,payment,parts,merchant}}
arquivo.onchange=async()=>{let f=arquivo.files[0];if(!f)return;status.innerHTML='<div class="notice">Lendo comprovante...</div>';try{let text='';if(f.type.startsWith('image/')){let w=await Tesseract.createWorker('por');let r=await w.recognize(f);text=r.data.text;await w.terminate()}else text=await f.text();status.innerHTML='';novoLanc(parseText(text))}catch(e){status.innerHTML='<div class="notice">Não foi possível ler automaticamente. Preencha os dados manualmente.</div>';novoLanc()}};
document.querySelectorAll('[data-tab]').forEach(b=>b.onclick=()=>{document.querySelectorAll('[data-tab]').forEach(x=>x.classList.remove('on'));document.querySelectorAll('.section').forEach(x=>x.classList.remove('on'));b.classList.add('on');document.querySelector('#'+b.dataset.tab).classList.add('on')});window.addEventListener('beforeinstallprompt',e=>{e.preventDefault();promptInstall=e;install.hidden=false});install.onclick=async()=>{if(promptInstall){promptInstall.prompt();await promptInstall.userChoice;promptInstall=null;install.hidden=true}};if('serviceWorker'in navigator)navigator.serviceWorker.register('./sw.js');render();
</script></body></html>
